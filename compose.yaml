# Local infrastructure: `docker compose up -d`
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: clearhouse
      POSTGRES_USER: clearhouse
      POSTGRES_PASSWORD: clearhouse
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearhouse -d clearhouse"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Kafka-compatible event stream. The ledger publishes transfer events to `ledger.transfers`.
  redpanda:
    image: redpandadata/redpanda:v26.2.3
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"

  # Web UI for browsing topics and messages: http://localhost:8081
  redpanda-console:
    image: redpandadata/console:v3.12.0
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8081:8080"
    depends_on:
      - redpanda

volumes:
  postgres-data:
