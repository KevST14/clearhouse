spring.application.name=ledger

# Matches compose.yaml at the repo root. Tests ignore this and start their own Postgres.
spring.datasource.url=jdbc:postgresql://localhost:5432/clearhouse
spring.datasource.username=clearhouse
spring.datasource.password=clearhouse

# Flyway owns the schema; Hibernate only checks that the entities still match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Update rows in a consistent (primary key) order so two transfers going in opposite
# directions between the same accounts can't deadlock each other.
spring.jpa.properties.hibernate.order_updates=true
