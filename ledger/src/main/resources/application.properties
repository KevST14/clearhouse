spring.application.name=ledger

# Matches compose.yaml at the repo root. Tests ignore this and start their own containers.
spring.datasource.url=jdbc:postgresql://localhost:5432/clearhouse
spring.datasource.username=clearhouse
spring.datasource.password=clearhouse
spring.kafka.bootstrap-servers=localhost:19092

# Flyway owns the schema; Hibernate only checks that the entities still match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# A send only counts once every in-sync replica has it, and the producer's own retries
# can't create duplicates.
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

clearhouse.outbox.poll-interval=500ms
