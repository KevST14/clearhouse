name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ledger:
    name: Ledger (Java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ledger
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Integration tests start Postgres with Testcontainers; the runner already has Docker.
      - run: ./mvnw -B verify

  generator:
    name: Traffic generator (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: generator
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  dashboard:
    name: Dashboard (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: dashboard/.nvmrc
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      # Type-checks, then bundles.
      - run: npm run build
